server {
    listen 80;
    server_name localhost;

    # Serve the Vue app's static files
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router uses HTML5 history mode — any route that doesn't
    # match a real file should fall back to index.html so Vue Router
    # can handle it client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api requests to the backend container
    # Docker Compose networking means we can reach the backend
    # by its service name "backend" on its internal port 3000
    location /api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}